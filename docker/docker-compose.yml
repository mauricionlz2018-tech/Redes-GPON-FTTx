services:
  postgres:
    image: postgres:16-alpine
    container_name: gpon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gpon_admin
      POSTGRES_PASSWORD: gpon_secret
      POSTGRES_DB: gpon_inventory
    ports:
      - "5433:5432"
    volumes:
      - gpon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpon_admin -d gpon_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gpon_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gpon.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gpon_pgdata:
    driver: local
