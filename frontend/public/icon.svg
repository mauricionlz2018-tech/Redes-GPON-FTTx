<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gponGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="fiberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Fondo redondeado estilo App Icon -->
  <rect width="512" height="512" rx="110" fill="url(#gponGrad)" />
  <!-- Borde sutil -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Icono de Red Óptica / Topología Central -->
  <g transform="translate(60, 60) scale(0.76)" stroke="white" stroke-linecap="round" stroke-linejoin="round">
    <!-- Nodo Central ODF -->
    <rect x="206" y="40" width="100" height="90" rx="20" fill="#0284c7" stroke="#38bdf8" stroke-width="12" />
    <circle cx="236" cy="85" r="8" fill="#10b981" />
    <circle cx="256" cy="85" r="8" fill="#10b981" />
    <circle cx="276" cy="85" r="8" fill="#38bdf8" />

    <!-- Líneas de Fibra Troncal -->
    <path d="M 256 130 L 256 220" stroke="url(#fiberGrad)" stroke-width="14" />
    <path d="M 256 220 L 100 320" stroke="url(#fiberGrad)" stroke-width="12" />
    <path d="M 256 220 L 256 320" stroke="url(#fiberGrad)" stroke-width="12" />
    <path d="M 256 220 L 412 320" stroke="url(#fiberGrad)" stroke-width="12" />

    <!-- Nodos NAP 1, 2, 3 -->
    <rect x="50" y="320" width="100" height="85" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="10" />
    <rect x="206" y="320" width="100" height="85" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="10" />
    <rect x="362" y="320" width="100" height="85" rx="18" fill="#1e293b" stroke="#ef4444" stroke-width="10" />

    <!-- Puertos / Indicadores LEDs -->
    <circle cx="80" cy="362" r="6" fill="#10b981" />
    <circle cx="100" cy="362" r="6" fill="#10b981" />
    <circle cx="120" cy="362" r="6" fill="#10b981" />

    <circle cx="236" cy="362" r="6" fill="#f59e0b" />
    <circle cx="256" cy="362" r="6" fill="#f59e0b" />
    <circle cx="276" cy="362" r="6" fill="#f59e0b" />

    <circle cx="392" cy="362" r="6" fill="#ef4444" />
    <circle cx="412" cy="362" r="6" fill="#ef4444" />
    <circle cx="432" cy="362" r="6" fill="#ef4444" />
  </g>

  <!-- Texto Inferior GPON FTTx -->
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="4">
    GPON FTTx
  </text>
</svg>
